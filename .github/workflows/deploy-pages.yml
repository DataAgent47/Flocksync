name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Build web app
        run: |
          flutter build web --release --base-href /Flocksync/ \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=BACKEND_API_URL='${{ secrets.BACKEND_API_URL }}' \
            --dart-define=MAP_TILE_URL_TEMPLATE='${{ secrets.MAP_TILE_URL_TEMPLATE }}' \
            --dart-define=MAP_TILE_ATTRIBUTION='${{ secrets.MAP_TILE_ATTRIBUTION }}' \
            --dart-define=MAP_TILE_USER_AGENT_PACKAGE='${{ secrets.MAP_TILE_USER_AGENT_PACKAGE }}' \
        working-directory: frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build/web
