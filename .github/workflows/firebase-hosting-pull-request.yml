name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - name: Build Flutter web
        run: |
          cd frontend
          flutter build web \
            --dart-define=BACKEND_API_URL='${{ secrets.BACKEND_API_URL }}' \
            --dart-define=MAP_TILE_URL_TEMPLATE='${{ secrets.MAP_TILE_URL_TEMPLATE }}' \
            --dart-define=MAP_TILE_ATTRIBUTION='${{ secrets.MAP_TILE_ATTRIBUTION }}' \
            --dart-define=MAP_TILE_USER_AGENT_PACKAGE='${{ secrets.MAP_TILE_USER_AGENT_PACKAGE }}' \
            --dart-define=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --dart-define=SUPABASE_ANON_KEY='${{ secrets.SUPABASE_ANON_KEY }}'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLOCKSYNC_DCC08 }}
          projectId: flocksync-dcc08
          entryPoint: frontend
