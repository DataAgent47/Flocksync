name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - name: Build Flutter web
        run: |
          cd frontend
          flutter build web \
            --dart-define=BACKEND_API_URL='${{ secrets.BACKEND_API_URL }}' \
            --dart-define=MAP_TILE_URL_TEMPLATE='${{ secrets.MAP_TILE_URL_TEMPLATE }}' \
            --dart-define=MAP_TILE_ATTRIBUTION='${{ secrets.MAP_TILE_ATTRIBUTION }}' \
            --dart-define=MAP_TILE_USER_AGENT_PACKAGE='${{ secrets.MAP_TILE_USER_AGENT_PACKAGE }}' \
            --dart-define=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
            --dart-define=SUPABASE_ANON_KEY='${{ secrets.SUPABASE_ANON_KEY }}'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLOCKSYNC_DCC08 }}
          channelId: live
          projectId: flocksync-dcc08
          entryPoint: frontend
